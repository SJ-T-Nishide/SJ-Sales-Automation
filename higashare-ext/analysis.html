<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>AI分析・提案 - 東カレ自動化</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { font-size: 20px; font-weight: 700; color: #c0392b; margin-bottom: 20px; }

    /* サマリーカード */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .card-label { font-size: 11px; color: #888; margin-bottom: 4px; }
    .card-value { font-size: 26px; font-weight: 700; color: #c0392b; }
    .card-sub { font-size: 12px; color: #555; margin-top: 2px; }

    /* パターン比較テーブル */
    .section { margin-bottom: 24px; }
    .section-title {
      font-size: 13px; font-weight: 700; color: #444;
      margin-bottom: 10px; padding-bottom: 6px;
      border-bottom: 2px solid #c0392b;
    }
    table {
      width: 100%; border-collapse: collapse;
      background: #fff; border-radius: 10px;
      overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    th {
      background: #2c3e50; color: #fff;
      font-size: 12px; font-weight: 600;
      padding: 10px 12px; text-align: left;
    }
    td { font-size: 12px; padding: 9px 12px; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .rate-good { color: #27ae60; font-weight: 700; }
    .rate-bad { color: #e74c3c; }
    .best-row td { background: #eafaf1 !important; }

    /* AI分析結果 */
    .analysis-box {
      background: #fff;
      border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.7;
      color: #333;
    }
    .analysis-box.loading { color: #888; font-style: italic; }

    /* ボタン */
    .actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    .btn {
      padding: 8px 16px; border-radius: 6px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: none;
    }
    .btn-primary { background: #c0392b; color: #fff; }
    .btn-primary:hover { background: #a93226; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: #fff; color: #555; border: 1px solid #ddd; }
    .btn-secondary:hover { background: #f5f5f5; }
    .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid #ddd; border-top-color: #c0392b;
      border-radius: 50%; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner.show { display: inline-block; }

    /* 履歴 */
    .history-item {
      background: #fff; border-radius: 8px; padding: 12px 14px;
      margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .history-date { font-size: 11px; color: #888; margin-bottom: 6px; }
    .history-text { font-size: 12px; line-height: 1.6; white-space: pre-wrap; max-height: 120px; overflow: hidden; }
    .history-text.expanded { max-height: none; }
    .expand-btn { font-size: 11px; color: #c0392b; cursor: pointer; margin-top: 4px; }

    #noData { text-align: center; padding: 40px; color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <h1>AI分析・改善提案</h1>

  <div class="actions">
    <button class="btn btn-primary" id="analyzeBtn">今すぐ分析する</button>
    <div class="spinner" id="spinner"></div>
    <button class="btn btn-secondary" id="refreshBtn">データ更新</button>
    <span id="lastUpdated" style="font-size:11px;color:#888;margin-left:auto;"></span>
  </div>

  <!-- サマリー -->
  <div class="summary-grid" id="summaryGrid">
    <div class="card"><div class="card-label">総いいね数</div><div class="card-value" id="totalLikes">-</div></div>
    <div class="card"><div class="card-label">総マッチ数</div><div class="card-value" id="totalMatches">-</div><div class="card-sub" id="avgMatchRate">-</div></div>
    <div class="card"><div class="card-label">総アポ数</div><div class="card-value" id="totalApos">-</div><div class="card-sub" id="avgApoRate">-</div></div>
    <div class="card"><div class="card-label">最高マッチ率パターン</div><div class="card-value" style="font-size:16px;" id="bestPattern">-</div></div>
  </div>

  <!-- パターン比較 -->
  <div class="section">
    <div class="section-title">パターン別コンバージョン比較</div>
    <div id="tableArea"><div id="noData">データがありません。シートに記録してから分析してください。</div></div>
  </div>

  <!-- AI分析結果 -->
  <div class="section">
    <div class="section-title">最新のAI分析・提案</div>
    <div class="analysis-box loading" id="analysisResult">「今すぐ分析する」を押すと、蓄積データをもとに改善提案を生成します。</div>
  </div>

  <!-- 分析履歴 -->
  <div class="section">
    <div class="section-title">分析履歴</div>
    <div id="historyArea"></div>
  </div>

  <script src="analysis.js"></script>
</body>
</html>
